name: Claude Review

# Reviews each non-draft pull request once when it opens or leaves draft. Ask for
# another pass by commenting @claude. Pull requests from forks do not receive
# repository secrets, so they are skipped.
on:
  pull_request:
    types: [opened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude review
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Review with Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for correctness bugs, regressions, and missed surfaces.
            Read AGENTS.md first and hold the change to it, including docs/internals/effect-services.md
            for server code, docs/internals/web-ui.md for web UI, and docs/internals/testing.md for tests.
            Skip style nitpicks the formatter and linter already enforce.
            Post inline comments for specific problems and one short summary comment. If you find nothing
            worth raising, say so in one line.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
